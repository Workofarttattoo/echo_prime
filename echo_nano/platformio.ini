[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; ESP32 Configuration
board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_build.flash_mode = dio

; Memory optimization
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -Os
    -ffunction-sections
    -fdata-sections

; Libraries
lib_deps =
    bblanchon/ArduinoJson@^6.21.0
    knolleary/PubSubClient@^2.8

; Monitor settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Upload settings
upload_speed = 921600
